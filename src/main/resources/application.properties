spring.application.name=smart-campus-management
server.port=8080

# ---- MySQL: change the password to yours ----
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate: tables are created/updated automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Sample data (src/main/resources/data.sql) ----
# Uses INSERT IGNORE, so it is safe to run on every start.
# Set to "never" once you have your own data and do not want deleted sample rows to come back.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.error.include-stacktrace=never
server.error.include-message=never

# ---- Swagger UI: http://localhost:8080/swagger-ui.html (log in to the app first) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
